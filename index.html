<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翰林國小數學乘法必備工具</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            /* 使用可愛的圓體字 */
            font-family: 'Zen Maru Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* 換成粉嫩的淺米色背景，更有可愛感 */
            background-color: #fffaf0; 
            margin: 0;
            padding: 40px 20px;
        }
        
        h1 { 
            color: #5d4037; /* 深咖啡色文字 */
            font-size: 2.5rem;   
            margin-bottom: 10px;
            text-align: center;
            line-height: 1.3;
        }

        .subtitle {
            font-size: 1.3rem;
            color: #8d6e63;
            margin-bottom: 40px;
            text-align: center;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            gap: 30px; /* 增加間距讓畫面不擁擠 */
            max-width: 800px;
        }

        .card {
            /* 【關鍵修改】移除背景色與陰影，讓白底消失 */
            background: transparent; 
            padding: 0;
            border-radius: 0;
            box-shadow: none; 
            
            text-align: center;
            text-decoration: none;
            color: #5d4037;
            transition: transform 0.3s ease;
            display: block;
        }

        /* 圖片容器：用來處理圓角與放大 */
        .img-container {
            width: 100%;
            height: auto;
            border-radius: 20px; /* 增加圓角寬度，更有可愛感 */
            overflow: hidden; 
            margin-bottom: 15px;
            /* 如果圖片本身是透明 PNG，這裡可以不加背景 */
        }

        .card img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.3s ease;
        }

        /* 滑鼠移過去：圖片放大，文字微微跳動 */
        .card:hover {
            transform: translateY(-5px);
        }

        .card:hover img {
            transform: scale(1.1);
        }

        .card p {
            font-size: 1.2rem;
            margin: 0;
            font-weight: 700;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .container { grid-template-columns: 1fr; } 
        }
    </style>
</head>
<body>

    <h1>翰林國小數學</h1>
    <div class="subtitle">乘法必備工具</div>

    <div class="container">
        <a href="https://www.google.com" target="_blank" class="card">
            <div class="img-container">
                <img src="2.png" alt="連結1">
            </div>
        </a>

        <a href="https://github.com" target="_blank" class="card">
            <div class="img-container">
                <img src="3.png" alt="連結2">
            </div>
        </a>

        <a href="https://www.wikipedia.org" target="_blank" class="card">
            <div class="img-container">
                <img src="4.png" alt="連結3">
            </div>
         </a>

        <a href="https://www.youtube.com" target="_blank" class="card">
            <div class="img-container">
                <img src="5.png" alt="連結4">
            </div>
        </a>
    </div>

</body>
</html>
