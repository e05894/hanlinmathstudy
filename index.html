<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翰林國小數學乘法必備工具</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #fffaf0; 
            margin: 0;
            padding: 40px 20px;
        }
        
        h1 { 
            color: #5d4037; 
            font-size: 3rem;   
            margin-bottom: 10px;
            text-align: center;
            line-height: 1.3;
        }

        .subtitle {
            font-size: 1.5rem;
            color: #8d6e63;
            margin-bottom: 50px;
            text-align: center;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            gap: 50px 40px; /* 增加上下間距，給放大留空間 */
            max-width: 700px; /* 縮小容器寬度，讓圖片整體看起來小一點 */
        }

        .card {
            background: transparent; 
            text-align: center;
            text-decoration: none;
            color: #5d4037;
            display: block;
            position: relative;
        }

        /* 圖片容器：不再限制邊界 */
        .img-container {
            width: 90%; /* 【關鍵】調整這裡可以讓圖片變小，目前是容器的 70% */
            margin: 0 auto 10px auto; /* 置中並留下方距離 */
            /* 移除 overflow: hidden; 讓圖片放大時不會被切掉 */
        }

        .card img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* 增加一點點彈性的放大感 */
        }

        /* 滑鼠移過去：圖片直接向外放大，沒有束縛感 */
        .card:hover img {
            transform: scale(1.1); /* 放大倍數，因為沒框了，可以放膽大一點 */
            z-index: 10; /* 確保放大時圖片在最上層 */
        }

        .card p {
            font-size: 1.2rem;
            margin: 0;
            font-weight: 700;
            transition: color 0.3s;
        }

        /* 移過去時文字顏色稍微變深 */
        .card:hover p {
            color: #2e1f1a;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .container { 
                grid-template-columns: 1fr; 
                gap: 60px; /* 手機版間距加大 */
            } 
            .img-container { width: 50%; } /* 手機版圖片比例 */
        }
    </style>
</head>
<body>

    <h1>翰林國小數學</h1>
    <div class="subtitle">乘法必備工具</div>

    <div class="container">
        <a href="https://hanlindigi.hle.com.tw/widget/1/233?subject=7" target="_blank" class="card">
            <div class="img-container">
                <img src="2.png" alt="快問快答">
            </div>
           </a>

        <a href="https://github.com" target="_blank" class="card">
            <div class="img-container">
                <img src="3.png" alt="連結2">
            </div>
          </a>

        <a href="https://hanlindigi.hle.com.tw/widget/1/187?subject=7" target="_blank" class="card">
            <div class="img-container">
                <img src="4.png" alt="十十乘法表">
            </div>
          </a>

        <a href="https://www.youtube.com" target="_blank" class="card">
            <div class="img-container">
                <img src="5.png" alt="連結4">
            </div>
        </a>
    </div>

</body>
</html>
