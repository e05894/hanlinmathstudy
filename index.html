<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翰林國小數學乘法必備工具</title>
    <style>
        body {
            font-family: "Noto Serif TC", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f4f4; /* 修改這裡的顏色碼 */
            margin: 0;
            padding: 20px;
        }
        h1 { color: #333; margin-bottom: 30px; }
        .container {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 兩行兩列 */
            gap: 20px;
            max-width: 800px;
        }
        .card {
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.2s;
        }
        .card:hover { transform: scale(1.05); }
        .card img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            display: block;
        }
        @media (max-width: 600px) {
            .container { grid-template-columns: 1fr; } /* 手機版改為單欄 */
        }
    </style>
</head>
<body>

    <h1>翰林國小數學<br>乘法必備工具</h1>

    <div class="container">
        <a href="https://www.google.com" target="_blank" class="card">
            <img src="https://via.placeholder.com/300x200?text=Image+1" alt="連結1">
            <p>前往 Google</p>
        </a>

        <a href="https://github.com" target="_blank" class="card">
            <img src="https://via.placeholder.com/300x200?text=Image+2" alt="連結2">
            <p>前往 GitHub</p>
        </a>

        <a href="https://www.wikipedia.org" target="_blank" class="card">
            <img src="https://via.placeholder.com/300x200?text=Image+3" alt="連結3">
            <p>前往 維基百科</p>
        </a>

        <a href="https://www.youtube.com" target="_blank" class="card">
            <img src="https://via.placeholder.com/300x200?text=Image+4" alt="連結4">
            <p>前往 YouTube</p>
        </a>
    </div>

</body>
</html>
