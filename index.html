<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翰林國小數學乘法必備工具</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* 基礎設定 */
        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #fffaf0;
            margin: 0;
            padding: 40px 20px;
            color: #5d4037;
        }
        
        h1 { 
            font-size: 2.5rem;   
            margin-bottom: 10px;
            text-align: center;
            line-height: 1.3;
            font-weight: 700;
        }

        .subtitle {
            font-size: 1.3rem;
            color: #8d6e63;
            margin-bottom: 40px;
            text-align: center;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            gap: 25px 15px; 
            max-width: 600px;
        }

        .card {
            background: transparent; 
            text-align: center;
            text-decoration: none;
            color: inherit;
            display: block;
            position: relative;
            cursor: pointer;
        }

        .img-container {
            width: 85%;
            margin: 0 auto 8px auto;
        }

        .card img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 15px;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card:hover img {
            transform: scale(1.15); 
            z-index: 10;
        }

        .card p {
            font-size: 1.1rem;
            margin: 0;
            font-weight: 700;
        }

        /* 燈箱樣式 */
        .lightbox {
            display: none; 
            position: fixed;
            z-index: 999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }

        .merged-img-container {
            display: flex;
            flex-direction: row;
            max-width: 90%;
            max-height: 80%;
            transform: scale(0.8);
            transition: transform 0.3s ease;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .lightbox.active .merged-img-container {
            transform: scale(1);
        }

        .merged-part {
            height: auto;
            max-width: 50%;
            flex: 1;
            object-fit: contain;
            display: block;
        }

/* 手機版適應優化 */
        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .subtitle { font-size: 1.1rem; }
            
            /* 讓主頁面卡片維持單欄 */
            .container { 
                grid-template-columns: 1fr; 
                gap: 30px 10px; 
            }

            /* 【關鍵修改】強制燈箱內的圖片在手機版依然「左右併排」 */
            .merged-img-container { 
                flex-direction: row !important; /* 強制不換行 */
                width: 95%; /* 增加寬度利用率 */
                align-items: center;
            }

            .merged-part { 
                max-width: 50% !important; /* 確保兩張圖各佔一半，不會把對方擠掉 */
                height: auto; 
            }
        }
    </style>
</head>
<body>

    <h1>翰林國小數學</h1>
    <div class="subtitle">乘法必備工具</div>

    <div class="container">
        <a href="https://hanlindigi.hle.com.tw/widget/1/233?subject=7" target="_blank" class="card">
            <div class="img-container">
                <img src="2.png" alt="快問快答">
            </div>
           </a>

    <div class="card" onclick="openLightbox('11.jpg', '12.jpg')">
            <div class="img-container">
                <img src="3.png" alt="課前暖身">
            </div>
        </div>

        <div class="card" onclick="openLightbox('21.jpg', '22.jpg')">
            <div class="img-container">
                <img src="5.png" alt="桌遊">
            </div>
        </div>

        <a href="https://hanlindigi.hle.com.tw/widget/1/187?subject=7" target="_blank" class="card">
            <div class="img-container">
                <img src="4.png" alt="十十乘法表">
            </div>
          </a>

    </div>
<div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <div class="merged-img-container">
            <img id="img-part-1" src="" alt="圖1" class="merged-part">
            <img id="img-part-2" src="" alt="圖2" class="merged-part">
        </div>
    </div>

    <script>
        function openLightbox(img1, img2) {
            const lightbox = document.getElementById('lightbox');
            // 設定要顯示的圖片路徑
            document.getElementById('img-part-1').src = img1;
            document.getElementById('img-part-2').src = img2;
            
            lightbox.style.display = 'flex';
            setTimeout(() => {
                lightbox.classList.add('active');
            }, 10);
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('active');
            setTimeout(() => {
                lightbox.style.display = 'none';
            }, 300);
        }
    </script>
</body>
</html>
